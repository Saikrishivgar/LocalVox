models:
  vad: silero-vad
  stt: mlx-community/whisper-large-v3-turbo-8bit
  llm: qwen3:8b
  ollama_base_url: http://127.0.0.1:11434
  tts_en: kokoro-onnx
  tts_ta: piper-ta_IN-rasa_female-medium
  embedding: BAAI/bge-m3
  qdrant_collection: study_notes
audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 512
  tts_sample_rate: 24000
  piper_sample_rate: 22050
  input_device: null
  output_device: null
thresholds:
  vad_speech_prob: 0.5
  min_speech_duration_ms: 250
  min_silence_duration_ms: 400
  rag_score_threshold: 0.65
  rag_top_k: 5
  max_stage_latency_ms: 1500.0
paths:
  data_dir: data
  qdrant_dir: data/qdrant
  models_dir: data/models
  vad_models_dir: data/models/vad
  stt_models_dir: data/models/stt
  tts_models_dir: data/models/tts
  wakeword_models_dir: data/models/wakeword
  logs_dir: logs
  latency_log_file: logs/latency.jsonl
  app_log_file: logs/app.log
  benchmarks_dir: docs
  test_audio_dir: data/test_audio
  tts_output_dir: data/tts_output
  memory_db_file: data/memory/localvox_memory.db
  conversations_db_file: data/memory/localvox_conversations.db
vad:
  model_name: silero-vad
  backend: onnx
  sample_rate: 16000
  threshold: 0.5
  min_speech_duration_ms: 250
  min_silence_duration_ms: 400
  speech_pad_ms: 30
  window_size_samples: 512
stt:
  model_name: mlx-community/whisper-large-v3-turbo-8bit
  local_model_path: data/models/stt/whisper-large-v3-turbo-8bit
  candidate_models:
  - data/models/stt/whisper-small-mlx
  - data/models/stt/whisper-large-v3-turbo-8bit
  - data/models/stt/whisper-large-v3-turbo
  backend: mlx
  device: mps
  default_language: null
  supported_languages:
  - en
  - ta
  sample_rate: 16000
  temperature: 0.0
  condition_on_previous_text: false
llm:
  model_name: qwen3:8b
  backend: ollama
  base_url: http://127.0.0.1:11434
  timeout_s: 120.0
  temperature: 0.4
  top_p: 0.9
  repeat_penalty: 1.12
  max_tokens: 512
  num_ctx: 8192
  think: false
  keep_alive: 10m
  system_prompt: You are LocalVox, a friendly, concise offline study assistant fluent
    in Tamil and English.
tts:
  default_backend: kokoro
  default_language: en
  output_dir: data/tts_output
  kokoro:
    model_name: kokoro-v1.0.onnx
    model_path: data/models/tts/kokoro/kokoro-v1.0.onnx
    voices_path: data/models/tts/kokoro/voices-v1.0.bin
    default_voice: af_heart
    lang_code: en-us
    supported_languages:
    - en
    - en-us
    - en-gb
    sample_rate: 24000
    speed: 1.0
  piper:
    en_model_name: en_US-lessac-medium
    en_model_path: data/models/tts/piper/en_US-lessac-medium/en/en_US/lessac/medium/en_US-lessac-medium.onnx
    en_config_path: data/models/tts/piper/en_US-lessac-medium/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
    ta_model_name: ta_IN-rasa_female-medium
    ta_model_path: data/models/tts/piper/ta_IN-rasa_female-medium/ta_IN-rasa_female-medium.onnx
    ta_config_path: data/models/tts/piper/ta_IN-rasa_female-medium/ta_IN-rasa_female-medium.onnx.json
    supported_languages:
    - en
    - ta
    sample_rate: 22050
    length_scale: 1.0
benchmark:
  hardware_name: Apple M5 MacBook Pro (24 GB Unified Memory)
  output_json_file: docs/model_benchmarks.json
  output_markdown_file: docs/model_benchmarks.md
  warmup_runs: 1
  benchmark_runs: 3
  max_stage_latency_ms: 1500.0
logging:
  level: INFO
  json_format: true
  stdout: true
  file: true
  app_log_file: logs/app.log
  latency_log_file: logs/latency.jsonl
pipeline:
  pre_speech_pad_ms: 288
  post_speech_pad_ms: 160
  vad_hangover_ms: 832
  min_utterance_ms: 256
  max_utterance_s: 20.0
  min_audio_rms: 0.002
  listen_timeout_s: null
  max_history_turns: 10
  max_history_chars: 12000
  tts_routing: auto
  stream_llm_output: true
  streaming_tts_enabled: true
  tts_min_sentence_chars: 16
  tts_max_chunk_chars: 220
  tts_queue_maxsize: 8
  tts_chunk_gap_ms: 35
  barge_in_enabled: true
  barge_in_sensitivity: medium
  barge_in_vad_threshold: 0.72
  barge_in_min_speech_ms: 224
  barge_in_min_rms: 0.015
  barge_in_echo_ratio: 1.4
  echo_suppression_enabled: true
  echo_max_delay_ms: 350
  echo_min_corr: 0.35
  echo_reference_window_ms: 250
  echo_tail_hold_ms: 200
  barge_in_profiles:
    low:
      vad_threshold_offset: 0.08
      rms_scale: 1.5
      speech_frames_offset: 2
    medium:
      vad_threshold_offset: 0.0
      rms_scale: 1.0
      speech_frames_offset: 0
    high:
      vad_threshold_offset: -0.08
      rms_scale: 0.65
      speech_frames_offset: -2
  voice_system_prompt: You are LocalVox, an offline voice study assistant fluent in
    Tamil, English, and Tanglish. Reply in natural, direct spoken sentences without
    Markdown formatting, bullet lists, or emojis. Do not repeat stock greetings or
    filler phrases like "Hello", "Great question", or "Sure, I can help". Keep answers
    concise (1 to 3 sentences) unless the user explicitly asks for a detailed explanation.
    Maintain conversation context and match the user's language (English in English,
    Tamil in Tamil, and Tanglish naturally) without claiming capabilities you do not
    have.
  clear_commands:
  - clear conversation
  - reset conversation
  - new topic
  exit_commands:
  - goodbye localvox
  - exit localvox
  - stop listening
memory:
  enabled: true
  db_path: data/memory/localvox_memory.db
  auto_extract: true
  async_extraction: true
  max_retrieved_memories: 5
  max_context_chars: 1200
  min_relevance_score: 0.2
  min_importance_to_store: 0.35
  recency_half_life_days: 30.0
  weight_lexical: 0.5
  weight_importance: 0.3
  weight_recency: 0.2
  privacy_filter_enabled: true
  extraction_max_tokens: 384
  extraction_temperature: 0.1
  pending_confirmation_timeout_s: 30.0
wakeword:
  enabled: true
  wake_phrase: Hey Jarvis
  model_name: hey_jarvis_v0.1
  models_dir: data/models/wakeword
  melspectrogram_model: data/models/wakeword/melspectrogram.onnx
  embedding_model: data/models/wakeword/embedding_model.onnx
  classifier_model: data/models/wakeword/hey_jarvis_v0.1.onnx
  sensitivity: medium
  threshold: 0.5
  patience_frames: 2
  cooldown_s: 2.0
  min_audio_rms: 0.003
  ack_enabled: true
  ack_text: Yes, I'm listening.
  activation_grace_ms: 350
  pre_roll_ms: 320
  conversation_timeout_s: 15.0
  execution_provider: cpu
  personal_profile_path: data/models/wakeword/voice_profile.npz
  personal_enabled: true
  personal_only: false
  personal_threshold: 0.68
server:
  host: 127.0.0.1
  port: 8000
  allowed_origins:
  - http://127.0.0.1:3000
  - http://localhost:3000
