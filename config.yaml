models:
  vad: silero-vad
  stt: mlx-community/whisper-large-v3-turbo
  llm: qwen2.5:14b-instruct
  ollama_base_url: http://127.0.0.1:11434
  tts_en: kokoro-82m
  tts_ta: piper-ta-IN
  embedding: BAAI/bge-m3
  qdrant_collection: study_notes

audio:
  sample_rate: 16000
