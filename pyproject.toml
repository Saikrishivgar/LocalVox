[project]
name = "localvox"
version = "0.1.0"
description = "Offline real-time Tamil+English voice study assistant for macOS Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.1",
    "mlx-whisper>=0.4.3",
    "numpy>=2.4.6",
    "onnxruntime>=1.32.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

